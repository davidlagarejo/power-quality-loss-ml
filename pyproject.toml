[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "power-quality-loss-ml"
version = "0.1.0"
description = "Auditable power-quality loss and cost prototype using power analyzer data and XGBoost."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "David Lagarejo" }
]
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0,<4"]
dev = ["pytest>=8,<9"]

[project.scripts]
pqloss = "power_quality_loss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
